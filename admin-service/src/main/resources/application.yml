server:
  port: 8085

spring:
  application:
    name: admin-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:barberbot}
    username: ${POSTGRES_USER:barberbot}
    password: ${POSTGRES_PASSWORD:barberbot}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:barberbot-dev-secret-key-change-in-production-minimum-256-bits-long}
  expiration-ms: 86400000

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    hr.lknezevic.barberbot: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
