server:
  port: 8081

spring:
  application:
    name: gateway-service
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

gateway:
  telegram:
    secret-token: ${TELEGRAM_SECRET_TOKEN}

management:
  endpoints:
    web:
      exposure:
        include: health
