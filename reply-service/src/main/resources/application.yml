server:
  port: 8083

spring:
  application:
    name: reply-service
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:barberbot}
    username: ${POSTGRES_USER:barberbot}
    password: ${POSTGRES_PASSWORD:barberbot}
    hikari:
      maximum-pool-size: 3

reply:
  telegram:
    bot-name: ${TELEGRAM_BOT_NAME}
    bot-username: ${TELEGRAM_BOT_USERNAME}
    bot-token: ${TELEGRAM_BOT_TOKEN}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    hr.lknezevic.barberbot: DEBUG
    org.springframework.amqp: INFO
    org.springframework.web: INFO
