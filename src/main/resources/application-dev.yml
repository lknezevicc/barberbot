server:
  port: 8080

spring:
  application:
    name: barber-bot
  ai:
    openai:
      api-key: ${OPENROUTER_API_KEY}
      # OpenRouter is OpenAI-compatible. Spring AI appends the OpenAI paths (e.g. /v1/chat/completions).
      # So this must be the API root, not the full endpoint.
      base-url: https://openrouter.ai/api
      chat:
        options:
          model: openai/gpt-oss-120b:free
          temperature: 0.0

telegram:
  bot-name: ${TELEGRAM_BOT_NAME}
  bot-username: ${TELEGRAM_BOT_USERNAME}
  bot-token: ${TELEGRAM_BOT_TOKEN}
  secret-token: ${TELEGRAM_SECRET_TOKEN}
  action-token-secret: ${TELEGRAM_ACTION_TOKEN_SECRET}

app:
  enabled: true
  worker:
    count: 3
    thread-name: "update-worker-"

resilience4j:
  circuitbreaker:
    instances:
      redisValue:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
      redisQueue:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    redis:
      enabled: true

logging:
  level:
    org.springframework.boot.context.config: DEBUG
    hr.lknezevic.barberbot: DEBUG
    io.github.resilience4j.circuitbreaker: INFO