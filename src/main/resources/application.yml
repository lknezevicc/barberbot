server:
  port: 8080

spring:
  application:
    name: barber-bot

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN}
  secret-token: ${TELEGRAM_SECRET_TOKEN}

app:
  enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    org.springframework.boot.context.config: DEBUG