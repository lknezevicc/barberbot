server:
  port: 8080

spring:
  application:
    name: barber-bot
  data:
    redis:
      host: redis
      port: 6379

telegram:
  bot-name: ${TELEGRAM_BOT_NAME}
  bot-username: ${TELEGRAM_BOT_USERNAME}
  bot-token: ${TELEGRAM_BOT_TOKEN}
  secret-token: ${TELEGRAM_SECRET_TOKEN}

app:
  enabled: true
  worker:
    count: 3
    thread-name: "update-worker-"

management:
  endpoints:
    web:
      exposure:
        include: health